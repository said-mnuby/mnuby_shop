<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Drop - Typing Speed Game</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --highlight-color: #4ade80;
            --danger-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            max-width: 95vw;
            height: 600px;
            max-height: 85vh;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 2px solid #334155;
        }

        /* Top HUD */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            background-color: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #334155;
            font-size: 1.1rem;
            font-weight: 600;
            z-index: 10;
        }

        .stat span {
            color: var(--accent-color);
        }

        #lives-display {
            color: var(--danger-color);
            letter-spacing: 3px;
        }

        /* Play Area */
        #play-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }

        .falling-word {
            position: absolute;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 4px 10px;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 6px;
            border: 1px solid #475569;
            user-select: none;
            transition: transform 0.05s;
            white-space: nowrap;
        }

        .falling-word.active-target {
            border-color: var(--highlight-color);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
            z-index: 5;
        }

        .typed-part {
            color: var(--highlight-color);
        }

        .remaining-part {
            color: var(--text-color);
        }

        /* Danger Zone Line */
        #ground {
            height: 6px;
            background: linear-gradient(90deg, transparent, var(--danger-color), transparent);
            width: 100%;
        }

        /* Input Area */
        #input-container {
            padding: 15px;
            background-color: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
        }

        #word-input {
            width: 60%;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #475569;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        #word-input:focus {
            border-color: var(--accent-color);
        }

        /* Overlays (Start & Game Over) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .overlay p {
            color: #94a3b8;
            margin-bottom: 25px;
            max-width: 450px;
            line-height: 1.5;
        }

        .final-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            background: var(--panel-bg);
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .final-stat-box {
            display: flex;
            flex-direction: column;
        }

        .final-stat-box span:first-child {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .final-stat-box span:last-child {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--highlight-color);
        }

        button {
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--bg-color);
            background-color: var(--accent-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none !important;
        }

        /* Screen Shake Effect on Miss */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.25s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div id="hud">
            <div class="stat">Score: <span id="score-display">0</span></div>
            <div class="stat">WPM: <span id="wpm-display">0</span></div>
            <div class="stat">Lives: <span id="lives-display">♥♥♥♥♥</span></div>
        </div>

        <!-- Play Area -->
        <div id="play-area"></div>
        <div id="ground"></div>

        <!-- Typing Input -->
        <div id="input-container">
            <input type="text" id="word-input" placeholder="Type words here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>WORD DROP</h1>
            <p>Type the falling words before they hit the red line at the bottom. Speed increases as your score climbs!</p>
            <button id="start-btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 style="color: var(--danger-color);">GAME OVER</h1>
            <p>The words reached the ground!</p>
            <div class="final-stats">
                <div class="final-stat-box">
                    <span>Final Score</span>
                    <span id="final-score">0</span>
                </div>
                <div class="final-stat-box">
                    <span>Average WPM</span>
                    <span id="final-wpm">0</span>
                </div>
            </div>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script>
        // Word Bank categorized roughly by difficulty
        const wordBank = [
            // Short / Easy
            "code", "data", "fast", "type", "byte", "node", "loop", "grid", "link", "file",
            "host", "port", "disk", "user", "task", "sync", "play", "jump", "drop", "fire",
            "wind", "star", "moon", "wave", "peak", "echo", "flux", "glow", "neon", "zero",
            // Medium
            "script", "window", "server", "client", "memory", "buffer", "stream", "socket",
            "binary", "string", "object", "method", "syntax", "module", "router", "packet",
            "system", "kernel", "thread", "driver", "screen", "canvas", "vector", "matrix",
            "planet", "rocket", "galaxy", "nebula", "energy", "photon", "cipher", "beacon",
            // Hard / Long
            "function", "variable", "constant", "database", "protocol", "compiler", "keyboard",
            "terminal", "software", "hardware", "internet", "security", "firewall", "algorithm",
            "structure", "interface", "component", "framework", "developer", "execution",
            "bandwidth", "frequency", "dimension", "satellite", "telescope", "astronaut"
        ];

        // DOM Elements
        const gameContainer = document.getElementById('game-container');
        const playArea = document.getElementById('play-area');
        const wordInput = document.getElementById('word-input');
        const scoreDisplay = document.getElementById('score-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const livesDisplay = document.getElementById('lives-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const finalWpmDisplay = document.getElementById('final-wpm');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let activeWords = [];
        let score = 0;
        let lives = 5;
        let isPlaying = false;
        let lastFrameTime = 0;
        let spawnTimer = 0;
        let spawnInterval = 2000; // ms between spawns
        let baseSpeed = 60; // pixels per second
        let startTime = 0;
        let totalCharsTyped = 0;
        let animationFrameId = null;

        // Start / Restart Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Keep input focused during gameplay
        gameContainer.addEventListener('click', () => {
            if (isPlaying) wordInput.focus();
        });

        function startGame() {
            // Reset state
            activeWords.forEach(w => w.element.remove());
            activeWords = [];
            score = 0;
            lives = 5;
            spawnInterval = 2000;
            baseSpeed = 65;
            totalCharsTyped = 0;
            startTime = Date.now();
            isPlaying = true;

            // Update UI
            updateHUD();
            wordInput.value = '';
            wordInput.disabled = false;
            wordInput.focus();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            // Spawn first word immediately
            spawnWord();
            lastFrameTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function spawnWord() {
            // Filter words based on current score to scale difficulty
            let pool = wordBank;
            if (score < 100) {
                pool = wordBank.filter(w => w.length <= 6);
            } else if (score < 300) {
                pool = wordBank.filter(w => w.length <= 8);
            }

            // Pick a random word not currently on screen
            let chosenText;
            let attempts = 0;
            do {
                chosenText = pool[Math.floor(Math.random() * pool.length)];
                attempts++;
            } while (activeWords.some(w => w.text === chosenText) && attempts < 10);

            // Create DOM element
            const el = document.createElement('div');
            el.className = 'falling-word';
            el.innerHTML = `<span class="typed-part"></span><span class="remaining-part">${chosenText}</span>`;
            playArea.appendChild(el);

            // Calculate random horizontal position within bounds
            const areaWidth = playArea.clientWidth;
            const wordWidth = el.offsetWidth;
            const maxX = Math.max(10, areaWidth - wordWidth - 15);
            const randomX = Math.floor(Math.random() * maxX) + 10;

            el.style.left = `${randomX}px`;
            el.style.top = `-35px`;

            // Speed variation slightly per word
            const speedMultiplier = 0.85 + Math.random() * 0.3;

            activeWords.push({
                text: chosenText,
                x: randomX,
                y: -35,
                speed: baseSpeed * speedMultiplier,
                element: el
            });
        }

        // Handle Typing Input
        wordInput.addEventListener('input', () => {
            if (!isPlaying) return;

            const typed = wordInput.value.trim().toLowerCase();
            
            // Check for exact match first
            const exactMatchIndex = activeWords.findIndex(w => w.text === typed);
            if (exactMatchIndex !== -1) {
                const matchedWord = activeWords[exactMatchIndex];
                
                // Update stats
                score += matchedWord.text.length * 10;
                totalCharsTyped += matchedWord.text.length;
                
                // Increase difficulty gradually
                baseSpeed = Math.min(220, 65 + Math.floor(score / 40));
                spawnInterval = Math.max(650, 2000 - Math.floor(score * 1.2));

                // Remove word
                matchedWord.element.remove();
                activeWords.splice(exactMatchIndex, 1);
                
                // Clear input & update UI
                wordInput.value = '';
                highlightMatches('');
                updateHUD();
                return;
            }

            // Highlight partial matches
            highlightMatches(typed);
        });

        function highlightMatches(typed) {
            // Sort by lowest on screen (highest Y) so the most urgent matching word gets target focus
            let targetAssigned = false;
            const sortedByUrgency = [...activeWords].sort((a, b) => b.y - a.y);

            sortedByUrgency.forEach(wordObj => {
                const typedSpan = wordObj.element.querySelector('.typed-part');
                const remSpan = wordObj.element.querySelector('.remaining-part');

                if (typed.length > 0 && wordObj.text.startsWith(typed)) {
                    typedSpan.textContent = wordObj.text.slice(0, typed.length);
                    remSpan.textContent = wordObj.text.slice(typed.length);
                    
                    if (!targetAssigned) {
                        wordObj.element.classList.add('active-target');
                        targetAssigned = true;
                    } else {
                        wordObj.element.classList.remove('active-target');
                    }
                } else {
                    typedSpan.textContent = '';
                    remSpan.textContent = wordObj.text;
                    wordObj.element.classList.remove('active-target');
                }
            });
        }

        function updateHUD() {
            scoreDisplay.textContent = score;
            livesDisplay.textContent = '♥'.repeat(Math.max(0, lives));
            
            // Calculate WPM (Standard: 5 characters = 1 word)
            const elapsedMinutes = (Date.now() - startTime) / 60000;
            const wpm = elapsedMinutes > 0 ? Math.round((totalCharsTyped / 5) / elapsedMinutes) : 0;
            wpmDisplay.textContent = wpm;
        }

        function triggerMiss() {
            lives--;
            updateHUD();
            
            // Visual shake feedback
            gameContainer.classList.remove('shake');
            void gameContainer.offsetWidth; // trigger reflow
            gameContainer.classList.add('shake');

            if (lives <= 0) {
                endGame();
            }
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            wordInput.disabled = true;

            finalScoreDisplay.textContent = score;
            finalWpmDisplay.textContent = wpmDisplay.textContent;
            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop(currentTime) {
            if (!isPlaying) return;

            const deltaTime = (currentTime - lastFrameTime) / 1000; // in seconds
            lastFrameTime = currentTime;

            // Spawn logic
            spawnTimer += deltaTime * 1000;
            if (spawnTimer >= spawnInterval) {
                spawnWord();
                spawnTimer = 0;
            }

            // Update word positions
            const playHeight = playArea.clientHeight;
            for (let i = activeWords.length - 1; i >= 0; i--) {
                const wordObj = activeWords[i];
                wordObj.y += wordObj.speed * deltaTime;
                wordObj.element.style.top = `${wordObj.y}px`;

                // Check if word hit the bottom
                if (wordObj.y + wordObj.element.offsetHeight >= playHeight) {
                    wordObj.element.remove();
                    activeWords.splice(i, 1);
                    
                    // If user was typing this word, clear input if no other word matches
                    const currentInput = wordInput.value.trim().toLowerCase();
                    if (currentInput && !activeWords.some(w => w.text.startsWith(currentInput))) {
                        wordInput.value = '';
                    }
                    highlightMatches(wordInput.value.trim().toLowerCase());
                    triggerMiss();
                }
            }

            // Periodically update WPM even between words
            updateHUD();

            if (isPlaying) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
